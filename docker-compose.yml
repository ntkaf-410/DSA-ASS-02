# The whole platform in one file: MySQL, Kafka, the topics and all seven services.
#
#   docker compose up -d --build            # everything
#   docker compose ps                       # first build takes a while, then everything should be "Up"
#   docker compose logs -f order-service    # follow one service
#   docker compose --profile tools up -d    # also start Kafka UI on http://localhost:8090
#   docker compose down                     # stop (add -v to also wipe the databases)
#
# The docker-compose.dev.yml inside each service folder is for working on that one service
# alone. Don't run a dev stack and this one at the same time, they both want port 9092.
#
# Ports:  customer 8081 | restaurant 8082 | order 8083 | payment 8084
#         delivery 8085 | notification 8086 | admin 8087
#         MySQL 3306 (root/root) | Kafka 9092 from the host, kafka:19092 between containers

# Every service gets the same database and broker settings, only dbName differs
# (each service already defaults to its own).
x-service-env: &service-env
  BAL_CONFIG_VAR_DBHOST: mysql
  BAL_CONFIG_VAR_DBPORT: "3306"
  BAL_CONFIG_VAR_DBUSER: root
  BAL_CONFIG_VAR_DBPASSWORD: root
  BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:19092

# Services start only once MySQL answers and the topics exist. Otherwise the first consumer
# to connect auto-creates its topics with 1 partition instead of the 3 we want.
x-service-depends: &service-depends
  mysql:
    condition: service_healthy
  kafka-init:
    condition: service_completed_successfully

services:
  # ---------- infrastructure ----------
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports: ["${MYSQL_PORT:-3306}:3306"]
    volumes:
      - platform_mysql_data:/var/lib/mysql
      # creates one schema per service on the very first start
      - ./infra/mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # 127.0.0.1 and not localhost: forces TCP, so the check stays red while the image is
      # still running the init script on its temporary socket-only server
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # Single-node Kafka in KRaft mode (no ZooKeeper). Two listeners because containers reach
  # the broker as kafka:19092 while tools on the host use localhost:9092.
  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    # no volume on purpose: a fresh broker on every `up` keeps demos repeatable,
    # kafka-init below recreates the topics each time
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  # One-shot job: creates all topics and exits. The services wait for it to finish.
  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      BOOTSTRAP_SERVER: kafka:19092
    volumes:
      - ./kafka/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["/bin/bash", "/create-topics.sh"]
    restart: "no"

  # ---------- services ----------
  customer-service:
    build: ./customer-service
    depends_on: *service-depends
    environment:
      <<: *service-env
    ports: ["8081:8081"]
    restart: on-failure

  restaurant-service:
    build: ./restaurant-service
    depends_on: *service-depends
    environment:
      <<: *service-env
    ports: ["8082:8082"]
    restart: on-failure

  # Validates the customer address and the menu over REST before it accepts an order,
  # so it needs to know where those two services are.
  order-service:
    build: ./order-service
    depends_on:
      <<: *service-depends
      customer-service:
        condition: service_started
      restaurant-service:
        condition: service_started
    environment:
      <<: *service-env
      BAL_CONFIG_VAR_CUSTOMERSERVICEURL: http://customer-service:8081
      BAL_CONFIG_VAR_RESTAURANTSERVICEURL: http://restaurant-service:8082
    ports: ["8083:8083"]
    restart: on-failure

  payment-service:
    build: ./payment-service
    depends_on: *service-depends
    environment:
      <<: *service-env
      BAL_CONFIG_VAR_SIMULATEPAYMENTFAILURE: "false"   # flip to "true" to demo the failed-payment path
    ports: ["8084:8084"]
    restart: on-failure

  delivery-service:
    build: ./delivery-service
    depends_on: *service-depends
    environment:
      <<: *service-env
    ports: ["8085:8085"]
    restart: on-failure

  notification-service:
    build: ./notification-service
    depends_on: *service-depends
    environment:
      <<: *service-env
      BAL_CONFIG_VAR_CUSTOMERSERVICEURL: http://customer-service:8081
    ports: ["8086:8086"]
    restart: on-failure

  # Reports + the "is everything up?" page, so it gets the address of every other service.
  admin-service:
    build: ./admin-service
    depends_on: *service-depends
    environment:
      <<: *service-env
      BAL_CONFIG_VAR_CUSTOMERSERVICEURL: http://customer-service:8081
      BAL_CONFIG_VAR_RESTAURANTSERVICEURL: http://restaurant-service:8082
      BAL_CONFIG_VAR_ORDERSERVICEURL: http://order-service:8083
      BAL_CONFIG_VAR_PAYMENTSERVICEURL: http://payment-service:8084
      BAL_CONFIG_VAR_DELIVERYSERVICEURL: http://delivery-service:8085
      BAL_CONFIG_VAR_NOTIFICATIONSERVICEURL: http://notification-service:8086
    ports: ["8087:8087"]
    restart: on-failure

  # ---------- optional tooling ----------
  # Browse topics and messages while demoing. Only starts with `--profile tools`.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    profiles: ["tools"]
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: food-delivery
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    ports: ["8090:8080"]

volumes:
  platform_mysql_data:
