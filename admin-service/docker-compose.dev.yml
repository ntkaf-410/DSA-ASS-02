# Stand-alone dev stack for the Admin Service only (MySQL + single-node Kafka).
# The full platform lives in ../docker-compose.yml, use this one to work on the reports alone.
#
#   docker compose -f docker-compose.dev.yml up -d mysql kafka   # infra only (run the service with `bal run`)
#   docker compose -f docker-compose.dev.yml up -d --build       # infra + containerised service
#
# MySQL is on host port 3312 so it doesn't clash with the other services' dev stacks.
# Kafka uses 9092 like theirs - don't run two of these Kafkas at once, point at one broker.
# With nothing else running, feed it with ./scripts/publish-test-events.sh.
services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: admin_db
    ports: ["3312:3306"]
    volumes:
      - admin_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12

  admin-service:
    build: .
    depends_on:
      mysql: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      BAL_CONFIG_VAR_DBHOST: mysql
      BAL_CONFIG_VAR_DBPORT: "3306"
      BAL_CONFIG_VAR_DBPASSWORD: root
      BAL_CONFIG_VAR_KAFKABOOTSTRAP: kafka:19092
    ports: ["8087:8087"]
    restart: on-failure

volumes:
  admin_mysql_data:
